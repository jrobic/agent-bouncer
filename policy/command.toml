# bouncer baseline policy — command family (destructive/exfiltration/
# escalation shell patterns, and the git conditional-dispatch tables).
#
# Rule row schema, uniform across families: {id, regex, reason}, plus
# optional `flags` (regex flags, e.g. "i"), `except` (a single negating
# regex — a match here overrides a match on `regex`), and `special` (an
# engine-recognized marker for logic no regex alone can express). See
# docs/reference/policy.md for the full row shape and the three
# declarative git-conditional forms below (ask_flags/safe_first_arg/
# safe_grammar).
#
# Two git subcommands are outside this file entirely: `checkout` (pathspec
# detection) and `restore` (index-only form — `--staged` plus one or more
# pathspecs) need real parsing beyond any of the three declarative forms
# below, and stay in src/command-rules.ts under their own named rule ids
# (see checkGitCheckout/checkGitRestore).

[[rules.command.bash]]
id = "dd-device-write"
regex = "\\bdd\\s+[^|;&\\n]*\\bof=\\/dev\\/"
reason = "dd writing to a block device (/dev/...) — likely disk wipe"

[[rules.command.bash]]
id = "mkfs"
regex = "\\bmkfs(\\.\\w+)?\\b"
reason = "mkfs reformats a filesystem — irreversible"

[[rules.command.bash]]
id = "device-redirect-shell"
regex = ">\\s*\\/dev\\/(sda|sdb|disk|nvme|hd|md|loop)\\w*"
reason = "Shell redirection writing to a block device (potential disk corruption)"

[[rules.command.bash]]
id = "device-redirect-tee"
# Ticket 41 round 1: any operand (flag or an extra destination file -- tee
# writes every file it's given) may sit before the target, bounded to 8;
# the excluded shell control characters keep a pipe/semicolon/`&`
# boundary from being crossed (`tee out.txt | grep /dev/sda1` stays
# allow). A quoted target ("/dev/sda") is a known limit (see the
# known-limit fixture): a quoted operand still matches this class, so it
# is consumed as one more operand instead of recognized as the target.
# The bound is doctrine here, not a fix: the mandatory part below is a
# fixed literal, not a pattern a padding token can also satisfy, so this
# row was already linear unbounded (see chmod-root's comment below for
# the row that needed the bound).
regex = "\\btee\\s+(?:[^\\s|;&]+\\s+){0,8}\\/dev\\/(sda|sdb|disk|nvme|hd|md|loop)\\w*"
reason = "tee writing to a block device (potential disk corruption)"

[[rules.command.bash]]
id = "chmod-root"
# Ticket 41: -R must appear somewhere among the flags (bundled or split,
# before or after other flags: -Rf, -fR, -v -R, -R -v, --recursive), never
# via lookaround — recursion stays required, chmod -v 777 / (no -R) stays
# allow. Round 1: both repetitions are bounded to {0,8}, not `*`. A `-R`
# token satisfies BOTH the leading repetition and the mandatory R group,
# so unbounded repetitions made this O(n^2) in the number of flag-shaped
# tokens -- past ~16000 of them the regex engine exhausted its
# backtracking budget and reported "no match" on a string that DOES
# contain a real `chmod -R 777 /` later (a silent fail-open). Bounding
# caps that at O(1) per position regardless of input size; the cost is
# that a 9th-or-later flag before the mode escapes detection -- no real
# chmod invocation carries that many (see
# tests/command-rules.test.ts's adversarial-padding lock). `0*`, not
# `0?`, on the mode's leading zeros: `0?` missed `chmod -R 000777 /`
# (three leading zeros), matching setuid's own convention.
regex = "\\bchmod\\s+(?:-\\S+\\s+){0,8}-(?:-recursive|\\w*R\\w*)\\s+(?:-\\S+\\s+){0,8}0*[0-7]{1,4}\\s+\\/(?:\\s|$)"
reason = "Recursive chmod on / — likely to break the system"

[[rules.command.bash]]
id = "chown-root"
# Ticket 41: same -R-anywhere-in-flags idiom as chmod-root above (bundled
# or split, before or after other flags: -Rh, -R -h, --recursive) —
# recursion stays required, chown root / (no -R) stays allow. Round 1:
# both repetitions bounded to {0,8} for the same reason as chmod-root's
# comment above (a `-R` token satisfies both groups, unbounded that's
# O(n^2) and fails open past ~16000 tokens).
regex = "\\bchown\\s+(?:-\\S+\\s+){0,8}-(?:-recursive|\\w*R\\w*)\\s+(?:-\\S+\\s+){0,8}\\S+\\s+\\/(?:\\s|$)"
reason = "Recursive chown on / — likely to break the system"

# Debatable (ticket 13): fires on ANY curl file upload, including a
# legitimate one (e.g. posting a build artifact to an internal API) —
# some consumers may want to narrow this to known-untrusted destinations.
[[rules.command.bash]]
id = "curl-file-upload"
regex = "\\bcurl\\b[^|;&\\n]*?\\s(?:(?:-d|--data|--data-binary|--data-raw|--data-urlencode)\\s+@\\S+|(?:-F|--form)\\s+\\S*=@|(?:-T|--upload-file)\\s+\\S+)"
reason = "curl uploading a local file (potential exfiltration)"

[[rules.command.bash]]
id = "wget-post-file"
regex = "\\bwget\\b[^|;&\\n]*--post-(?:file|data)="
reason = "wget posting a local file or data (potential exfiltration)"

[[rules.command.bash]]
id = "nc-file-redirect"
regex = "\\bn(?:c|cat)\\b[^|;&\\n]*<\\s*[^\\s<]"
reason = "netcat reading a file via stdin redirection (exfiltration)"

[[rules.command.bash]]
id = "setuid"
# Four forms covered:
#   - numeric, any number of leading zeros: `0*[2-7][0-7]{3}` — zero or
#     more leading zeros, then the setuid/setgid digit [2-7], then 3 more
#     octal digits. GNU coreutils and macOS both accept a zero-padded
#     mode (`04755`, `004755`) — this is 4 significant digits after the
#     zeros, not "exactly 4 digits" overall. A plain 3-digit mode
#     (chmod 755) never has 4 digits after the zeros to match; a mode
#     with no special bit (chmod 0644, chmod 1755 — sticky only) has its
#     post-zero leading digit outside [2-7].
#   - symbolic: `[ugoa]*[+=][rwxXst]*s[rwxXst]*` — an assignment (`+` or
#     `=`, not `-`: a removal like `a-s` is not a grant) whose permission
#     letters include `s` anywhere among them, not only adjacent to the
#     operator or at the end (`u+rws`, `g=rxs`, `u+st`, `u+sx` all grant).
#   - symbolic, comma-separated clause list: `(?:[ugoa]*[+=-][rwxXst]*,)*`
#     prefixed onto the symbolic form above, so a grant buried behind
#     other clauses is still caught (`u+x,g+s`, `a+st,o+r`).
#   - flags between `chmod` and the mode: `(?:-\S+\s+)*` — short and long
#     option tokens ahead of the mode argument (`chmod -R u+s dir`,
#     `chmod -v 4755 f`). This also consumes `--reference=other` as a
#     flag: `chmod --reference=other f` copies another file's mode, and a
#     setuid/setgid grant by reference is invisible to a regex on this
#     command's own text — a known, undetectable limit (see the
#     known-limit fixture), not a gap this rule closes.
regex = "\\bchmod\\s+(?:-\\S+\\s+)*(?:(?:[ugoa]*[+=-][rwxXst]*,)*[ugoa]*[+=][rwxXst]*s[rwxXst]*|0*[2-7][0-7]{3})\\b"
reason = "chmod setting setuid/setgid bit"

[[rules.command.bash]]
id = "etc-write-shell"
regex = "(?:>|>>)\\s*\\/etc\\/(sudoers|passwd|shadow|hosts|ssh\\/sshd_config)\\b"
reason = "Writing to a critical /etc file (sudoers, passwd, shadow, hosts, sshd_config)"

[[rules.command.bash]]
id = "etc-write-tee"
# Ticket 41 round 1: same operand-before-target idiom as
# device-redirect-tee above.
regex = "\\btee\\s+(?:[^\\s|;&]+\\s+){0,8}\\/etc\\/(sudoers|passwd|shadow|hosts|ssh\\/sshd_config)\\b"
reason = "tee writing to a critical /etc file (sudoers, passwd, shadow, hosts, sshd_config)"

[[rules.command.bash]]
id = "kill-init"
# Ticket 41: any signal spelling before the pid, zero or more times
# (bounded to {0,8}, round 1 — doctrine only: this row's mandatory target
# below is three fixed literals, not a pattern a signal token can also
# satisfy the way chmod-root's `-R` alternation could, so it was already
# linear unbounded), in any order relative to a `--` end-of-options
# separator — a literal numeric or named signal (`-9`, `-15`, `-TERM`,
# `-SIGKILL`, any case: round 1, `killall` lists its own signals in
# lowercase on this platform and bash's `kill -term` kills), `-s <sig>` or
# `-n <signum>` (round 1: bash `kill`'s own `-n` form was missing),
# `--signal <sig>`/`--signal=<sig>`, or a bare `--`. The letter class
# requires at least two characters (`{2,}`), which is what keeps `-l`
# (list signal names, one letter) and `kill -l 1` (lists signal 1's
# name — kills nothing) from being read as a signal, without lookaround:
# every real signal name is at least two characters (the shortest is
# `IO`). Each recognized token must be followed by whitespace before the
# next one is tried, which is what keeps a final `-1` target from being
# swallowed as one more signal token instead of matching the target
# alternation (backtracking settles on the split that lets the whole
# regex match). The target set is explicit: `1`, `init`, and `-1` (every
# process this agent can signal) — `kill -9 -1` used to block by a regex
# accident (an unrelated `-?-?` shim happened to eat one leading dash)
# and `kill -- -1` used to pass; both are deliberate now. Only enumerated
# signal spellings are skipped: a killall-specific flag ahead of the
# signal (`-q`, `-u`, `-t`, …) is not, and neither is a shell-expanded
# signal or target (see docs/reference/policy.md § Known limits and the
# known-limit fixtures).
regex = "\\bkill(?:all)?\\s+(?:(?:-[sn]\\s+\\S+|--signal(?:=|\\s+)\\S+|-[0-9]+|-[A-Za-z]{2,}[0-9]*|--)\\s+){0,8}(?:1|init|-1)\\b"
reason = "Killing PID 1, init, or -1 (every process this agent can signal) — system halt"

[[rules.command.bash]]
id = "fork-bomb"
regex = ":\\s*\\(\\s*\\)\\s*\\{\\s*:\\s*\\|\\s*:\\s*&\\s*\\}\\s*;\\s*:"
reason = "Fork bomb pattern detected"

[[rules.command.bash]]
id = "download-exec"
regex = "(?:curl|wget)\\b[^|;&\\n]*\\|\\s*(?:sh|bash|zsh|ksh|fish|sudo)\\b"
reason = "Piping curl/wget output directly to a shell (download-and-execute)"

[[rules.command.bash]]
id = "eval-download"
regex = "\\beval\\s+[\"']?(?:\\$\\(|`)\\s*(?:curl|wget)\\b"
reason = "eval of curl/wget output (download-and-execute)"

[[rules.command.bash]]
id = "process-substitution-download"
regex = "\\b(?:bash|sh|zsh|ksh)\\s+<\\s*\\(\\s*(?:curl|wget)\\b"
reason = "Process substitution feeding curl/wget output to a shell (download-and-execute)"

# The verb list is repeated on purpose: policy rows are literal regexes, no templating at load.
# Ticket 29: confirm rather than block — `fd -e orig -x rm` can be legitimate.
[[rules.command.bash]]
id = "fd-exec-destructive"
regex = "\\bfd\\b[^|;&\\n]*\\s(?:-x|-X|--exec|--exec-batch)\\s+(?:rm|mv|chmod|chown|truncate|shred|git\\s+(?:rm|checkout|reset|clean|push)|sed\\s+-i)\\b"
reason = "fd exec form runs a destructive command once per match"
verdict = "confirm"

# Ticket 29: confirm rather than block — `-ok` is indistinguishable from `-exec` for an agent.
[[rules.command.bash]]
id = "find-exec-destructive"
regex = "\\bfind\\b[^|;&\\n]*\\s(?:-delete\\b|(?:-exec|-execdir|-ok)\\s+(?:rm|mv|chmod|chown|truncate|shred|git\\s+(?:rm|checkout|reset|clean|push)|sed\\s+-i)\\b)"
reason = "find exec form runs a destructive command once per match"
verdict = "confirm"

# Ticket 29: confirm rather than block — bulk proxy execution can be legitimate.
[[rules.command.bash]]
id = "xargs-destructive"
regex = "\\b(?:xargs|parallel)\\b[^|;&\\n]*\\s(?:rm|mv|chmod|chown|truncate|shred|git\\s+(?:rm|checkout|reset|clean|push)|sed\\s+-i)\\b"
reason = "xargs or parallel runs a destructive command for each input"
verdict = "confirm"

# Ticket 29: confirm rather than block — a deliberate per-file preprocessor can be legitimate.
[[rules.command.bash]]
id = "rg-pre-exec"
regex = "\\brg\\b[^|;&\\n]*\\s--pre(?:=|\\s+)\\S+"
reason = "rg preprocessor runs an arbitrary command for each searched file"
verdict = "confirm"

# Ticket 30: confirm rather than block — publishing is intentional only after a human checks the target.
[[rules.command.bash]]
id = "publish"
regex = "\\b(?:npm|pnpm|yarn)\\s+publish\\b|\\bcargo\\s+publish\\b|\\bgem\\s+push\\b|\\bpoetry\\s+publish\\b|\\btwine\\s+upload\\b|\\bdocker\\s+push\\b|\\bdocker\\s+compose\\s+push\\b|\\bdocker-compose\\s+push\\b|\\b(?:gh|glab)\\s+release\\s+(?:create|delete|upload)\\b"
except = "^\\s*(?:npm|pnpm|yarn)\\s+publish\\s+--dry-run\\s*$"
reason = "publishes or withdraws a package or artifact on a public registry"
verdict = "confirm"

# Ticket 30: confirm rather than block — forge API writes can be intended but affect remote state.
[[rules.command.bash]]
id = "forge-api-write"
regex = "\\b(?:gh|glab)\\s+api\\b[^|;&\\n]*\\s(?:-X|--method)(?:\\s+|=)(?:POST|PUT|PATCH|DELETE)\\b|\\b(?:gh|glab)\\s+api\\b[^|;&\\n]*\\s(?:-f|-F|--field|--raw-field|--input)\\b"
reason = "gh or glab API request mutates remote forge state"
verdict = "confirm"

[[rules.command.bash]]
id = "base64-decode-exec"
regex = "\\b(?:base64\\s+(?:-d|--decode|-D)\\b|xxd\\s+-r\\b|openssl\\s+enc\\s+-d\\b)[^|;&\\n]*\\|\\s*(?:sh|bash|zsh|python3?|node|perl)\\b"
reason = "Decoded payload piped directly into a shell or interpreter"

# Ticket 32: trusting a project .envrc makes it execute on later directory changes.
[[rules.command.bash]]
id = "direnv-trust"
regex = "\\bdirenv\\s+(?:allow|permit|grant)\\b"
reason = "direnv grants a project .envrc permission to run outside this session"
verdict = "confirm"

# Ticket 32: scheduled jobs and services run later with the human's rights.
[[rules.command.bash]]
id = "persistence-scheduler"
regex = "\\bcrontab\\s+(?:-u\\s+\\S+\\s+)*(?:-\\s|-$|-\\S*[er]\\S*(?:\\s|$)|[^-\\s]\\S*(?:\\s|$))|\\blaunchctl\\s+(?:load|bootstrap|enable|submit|kickstart)\\b|\\bsystemctl\\s+(?:(?:--user\\s+)?enable|--user\\s+start|(?:--user\\s+)?(?:restart|reload|daemon-reload))\\b|(?:^|[|;&\\n]\\s*)at\\s+(?:-f\\s+\\S+\\s+|-\\S+\\s+)*(?:now|noon|midnight|teatime|\\+|\\d)|(?:^|[|;&\\n]\\s*)batch\\b"
reason = "installs a schedule or service that can run later outside this session"
verdict = "confirm"

# Ticket 33: confirm rather than block — Terraform changes infrastructure state, so a human verifies the target first.
[[rules.command.bash]]
id = "terraform-mutating"
regex = "\\b(?:terraform|tofu)\\s+(?:apply|destroy|import|state\\s+(?:rm|mv|push))\\b"
reason = "Terraform or OpenTofu command mutates infrastructure state or resources"
verdict = "confirm"

# Ticket 33: confirm rather than block — cluster mutations need a human target check.
# Debatable (ticket 33): relax local `kubectl apply`/`create` in a profile with
# `[[override]]`, `action = "relax"`, `verdict = "observe"`, and
# `reason = "our local cluster is disposable and managed by reviewed automation"`.
[[rules.command.bash]]
id = "kubectl-mutating"
regex = "\\bkubectl\\b[^|;&\\n]*\\s(?:apply|create|delete|drain|cordon|taint|replace|patch|scale|rollout\\s+(?:restart|undo))\\b"
except = "^[^|;&\\n]*\\b(?:apply|create)\\b[^|;&\\n]*--dry-run[^|;&\\n]*$"
reason = "kubectl command mutates Kubernetes cluster resources"
verdict = "confirm"

# Ticket 33: confirm rather than block — release mutations need a human target check.
# Debatable (ticket 33): relax local `helm install` in a profile with
# `[[override]]`, `action = "relax"`, `verdict = "observe"`, and
# `reason = "our local release lifecycle is managed by reviewed automation"`.
[[rules.command.bash]]
id = "helm-mutating"
regex = "\\bhelm\\s+(?:install|upgrade|uninstall|delete|rollback)\\b"
except = "^[^|;&\\n]*\\b(?:install|upgrade)\\b[^|;&\\n]*--dry-run[^|;&\\n]*$"
reason = "Helm command mutates a release"
verdict = "confirm"

# Ticket 33: confirm rather than block — deleting Docker data warrants human review.
# Debatable (ticket 33): relax local volume resets in a profile with
# `[[override]]`, `action = "relax"`, `verdict = "observe"`, and
# `reason = "our local volume reset is intentional during development"`.
[[rules.command.bash]]
id = "docker-destructive"
regex = "\\b(?:docker\\s+(?:system\\s+prune|volume\\s+(?:rm|prune))|(?:docker\\s+compose|docker-compose)\\s+down\\b[^|;&\\n]*\\s(?:-v|--volumes)\\b)"
special = "docker_destructive"
reason = "Docker command deletes system or volume data"
verdict = "confirm"

# Ticket 33: confirm rather than block — destructive SQL needs human review.
# Debatable (ticket 33): relax local destructive SQL in a profile with
# `[[override]]`, `action = "relax"`, `verdict = "observe"`, and
# `reason = "our local database reset is intentional during development"`.
[[rules.command.bash]]
id = "sql-destructive-inline"
regex = "(?:\\b(?:psql|mysql)\\b[^|;&\\n]*\\s(?:-c|-e)\\s+[\"'][^\"']*\\b(?:DROP|TRUNCATE|DELETE\\s+FROM|ALTER)\\b|\\bsqlite3\\b[^|;&\\n]*\\s+[\"'][^\"']*\\b(?:DROP|TRUNCATE|DELETE\\s+FROM|ALTER)\\b)"
flags = "i"
reason = "Inline SQL command mutates database data or schema"
verdict = "confirm"

[rules.command.rm_rf]
# The `rm -rf` blocklist: each entry is a regex the rm target must NOT
# match. A target that matches none of them (node_modules, dist, .next,
# .turbo, coverage, .cache, and similar build-artifact directories at any
# depth) is allowed by omission — there is no separate "safe targets"
# table; safety here just means "matched nothing below".
dangerous_targets = [
    "^\\/$",
    "^\\/\\*$",
    "^~\\/?$",
    "^~\\/\\*$",
    "^\\$\\{?HOME\\}?\\/?$",
    "^\\$\\{?HOME\\}?\\/\\*$",
    "^\\.\\.\\/?$",
    "^\\.\\.\\/\\*$",
    "^\\*$",
    "^\\.\\/?$",
    "^\\/(etc|usr|var|bin|sbin|lib|sys|proc|boot|root|home|opt|srv|System|Library|Applications)(\\/.*)?$",
  ]

[rules.command.privilege_escalation]
commands = [
    "sudo",
    "doas",
    "pkexec",
    "runas",
    "please",
  ]

[rules.command.git]
safe_subcommands = [
    "status",
    "diff",
    "log",
    "show",
    "blame",
    "shortlog",
    "describe",
    "rev-parse",
    "ls-files",
    "cat-file",
    "grep",
    "add",
    "commit",
    "fetch",
    "ls-remote",
    "for-each-ref",
    "ls-tree",
    "check-ignore",
    "rev-list",
    "merge-base",
    "show-ref",
    "show-branch",
    "name-rev",
    "count-objects",
    "var",
    "range-diff",
    "cherry",
    "whatchanged",
    "diff-tree",
    "diff-index",
    "fsck",
  ]
# The single source of truth for "this is a git config READ, not a
# write" — shared with the secret family (hasUnsafeGitConfigRemoteUrl /
# isGitConfigRead in src/secret-rules.ts) and with this same file's
# `safe_first_arg` entry for `sub = "config"` below, whose `values` is
# left empty and filled in FROM this list at load time (see
# src/policy/baseline.ts) rather than repeating it a second time here.
config_read_modes = [
    "--get",
    "--get-all",
    "--get-regexp",
    "--get-urlmatch",
    "--list",
    "-l",
    "get",
    "list",
  ]

[[rules.command.git.ask_flags]]
sub = "branch"
flags = [
    "-d",
    "-D",
    "--delete",
    "-m",
    "-M",
    "--move",
    "-f",
    "--force",
  ]

[[rules.command.git.ask_flags]]
sub = "tag"
flags = [
    "-d",
    "--delete",
  ]

[[rules.command.git.ask_flags]]
sub = "switch"
flags = [
    "-C",
    "--force-create",
    "-f",
    "--force",
    "--discard-changes",
  ]

[[rules.command.git.ask_flags]]
sub = "symbolic-ref"
flags = [
    "-d",
    "--delete",
  ]
max_positionals = 1

[[rules.command.git.safe_first_arg]]
sub = "stash"
values = [
    "drop",
    "clear",
  ]
invert = true
safe_when_absent = true

[[rules.command.git.safe_first_arg]]
sub = "reflog"
values = [
    "show",
    "list",
    "exists",
  ]
safe_when_absent = true

[[rules.command.git.safe_first_arg]]
sub = "submodule"
values = [
    "status",
    "summary",
  ]
safe_when_absent = true

[[rules.command.git.safe_first_arg]]
sub = "remote"
values = [
    "-v",
    "--verbose",
    "show",
    "get-url",
  ]
safe_when_absent = true

[[rules.command.git.safe_first_arg]]
sub = "config"
# Left empty on purpose: filled in from `config_read_modes` above at load
# time (src/policy/baseline.ts) — see that field's comment. The two lists
# must always agree, so there is exactly one place the values are typed.
values = []
safe_when_absent = false

# Debatable (ticket 13): `bundle create` packages arbitrary repo history
# into one portable file, a secondary exfil-adjacent surface — gated
# defensively for how rarely it appears in an agentic session.
[[rules.command.git.safe_first_arg]]
sub = "bundle"
values = [
    "verify",
    "list-heads",
  ]
safe_when_absent = false

# Debatable (ticket 13): `worktree remove` can discard an inactive
# worktree's uncommitted changes — narrow, but real.
[[rules.command.git.safe_first_arg]]
sub = "worktree"
values = [
    "list",
  ]
safe_when_absent = false

[[rules.command.git.safe_grammar]]
sub = "apply"
sequences = [
    ["--check"],
    ["--check", "*"],
  ]

# Claude Code's configuration commands write harness state without naming a
# filesystem path, so this command-family row closes that separate surface.
[[rules.command.bash]]
id = "harness-self-config"
regex = "\\bclaude\\b\\s+(?:mcp\\s+(?:add|remove)|plugin\\s+(?:install|enable|disable|uninstall)|config\\s+set)\\b"
reason = "Claude Code command changes harness configuration or installed plugins"
verdict = "confirm"
