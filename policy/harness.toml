# Source: Oh My Pi configuration documentation
[[harness]]
id = "omp"
dir = ["(^|/)\\.omp/agent", "(^|/)\\.pi/agent"]
witness = "~/.omp/agent"
parents = ["(^|/)\\.omp", "(^|/)\\.pi"]
env = ["PI_CODING_AGENT_DIR"]
reason = "Oh My Pi agent configuration directory"

[[harness.persistent]]
id = "omp-config"
path = "config\\.ya?ml$"
reason = "Oh My Pi loads configuration at agent startup"

[[harness.persistent]]
id = "omp-models"
path = "models\\.ya?ml$"
reason = "Oh My Pi loads model configuration at agent startup"

[[harness.persistent]]
id = "omp-extensions"
path = "extensions(/|$)"
reason = "Oh My Pi executes extensions at agent boot"

