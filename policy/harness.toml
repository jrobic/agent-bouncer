# Declarative assistant configuration directories. Protected-write rows are derived
# by src/policy/schema.ts before the hand-written protected-write policy rows.

# Source: Claude Code settings documentation — configuration directory
[[harness]]
id = "claude-code"
dir = ["(^|/)\\.claude"]
witness = "~/.claude"
env = ["CLAUDE_CONFIG_DIR"]
reason = "Claude Code configuration directory"

[[harness.persistent]]
id = "harness-settings"
path = "settings(\\.local)?\\.json$"
reason = "Claude Code settings persist tool and hook configuration across sessions"

[[harness.persistent]]
id = "harness-hooks"
path = "hooks(/|$)"
reason = "Claude Code hooks can alter future tool-call enforcement"

[[harness.persistent]]
id = "harness-plugins"
path = "plugins(/|$)"
reason = "Claude Code plugins can alter future session behavior"

[[harness.persistent]]
id = "harness-instructions"
path = "CLAUDE\\.md$"
reason = "Claude Code instructions persist across future sessions"

# Source: OpenAI Codex configuration reference
[[harness]]
id = "codex"
dir = ["(^|/)\\.codex"]
witness = "~/.codex"
env = ["CODEX_HOME"]
reason = "Codex configuration directory"

[[harness.persistent]]
id = "codex-config"
path = "config\\.toml$"
reason = "Codex loads configuration at session start"

[[harness.persistent]]
id = "codex-instructions"
path = "AGENTS\\.md$"
reason = "Codex reads instructions for future sessions"

