# Declarative assistant configuration directory. Protected-write rows are
# derived by src/policy/schema.ts before the hand-written protected-write
# policy rows. One file per assistant (ADR-0006 § 2) — this file's `id` is
# its own filename. See docs/reference/policy.md § harness.
#
# Ticket 15a: renamed from `omp` — pi-agent (oh-my-zsh-to-zsh's "zsh") owns
# the directory convention; omp (the "oh-my-zsh") is a layer on top that
# inherits it, so `dir`/`parents`/`witness` still name both `~/.omp` and
# `~/.pi` and `reason` keeps citing Oh My Pi alongside pi-agent.

# Source: Oh My Pi / pi-agent configuration documentation
[[harness]]
id = "pi-agent"
dir = ["(^|/)\\.omp/agent", "(^|/)\\.pi/agent"]
witness = "~/.omp/agent"
parents = ["(^|/)\\.omp", "(^|/)\\.pi"]
env = ["PI_CODING_AGENT_DIR"]
reason = "pi-agent configuration directory (Oh My Pi is a layer on pi-agent and inherits this convention)"

[[harness.persistent]]
id = "pi-agent-config"
path = "config\\.ya?ml$"
reason = "pi-agent (and Oh My Pi) loads configuration at agent startup"

[[harness.persistent]]
id = "pi-agent-models"
path = "models\\.ya?ml$"
reason = "pi-agent (and Oh My Pi) loads model configuration at agent startup"

[[harness.persistent]]
id = "pi-agent-extensions"
path = "extensions(/|$)"
reason = "pi-agent (and Oh My Pi) executes extensions at agent boot"

# ADR-0006 § 3/7/10 (ticket 15c): pi-agent and omp are IN-PROCESS
# harnesses (ADR-0006 § 7, fact 5) — there is no stdin envelope the
# assistant itself writes; a printed shim extension does
# (`policy/harness/pi-agent.shim.ts`, `bouncer harness shim pi-agent`).
# The declaration therefore describes the OBJECT THE SHIM SENDS on the
# input side (`event`/`toolName`/`input`/`session`/`cwd`, never a real
# hook envelope field name) and the object the shim EXPECTS BACK on the
# output side (`deny.stdout = '{"block":true,...}'`, matching § 7's
# fixed `{ block, reason }` contract) — this file stays the one place
# that knows both the omp/pi-agent extension API AND bouncer's own
# abstract verdict vocabulary. `transport = "stdin-json"` is still
# correct: the shim itself writes one JSON object to `bouncer run
# --harness pi-agent`'s stdin, exactly like every other harness's hook —
# only WHO writes it (an extension, not the assistant process) differs,
# which is what `wiring = "shim-file"` (not `hook-file`) captures.
#
# Measured 2026-09-08, pi 0.84.1 / omp 18.1.10 (omp is a layer on
# pi-agent, oh-my-zsh-to-zsh — both share the extension API, ADR-0006
# fact 5): `pi.on("tool_call", (event, ctx) => …)` — `event.toolName`,
# `event.input`, `event.toolCallId`; a thrown handler blocks (fail-closed
# in the shim's own try/catch, never relied on here — the shim never
# throws by construction); `ctx.hasUI`, `await ctx.ui.confirm(title,
# text)` (resolves `false` with no UI attached); `ctx.ui.notify(text,
# level)`; `ctx.cwd`; `ctx.sessionManager.getSessionId()`;
# `pi.on("session_start", …)`. Below, per declared field name, updated
# through ticket 15c's review round 1 (tool-forced re-runs, P-3):
# `bash.command` confirmed LIVE on BOTH binaries (probes 1/3/7).
# `write.path`/`.content` confirmed LIVE on BOTH — omp natively; pi via
# the review round 1 tool-forced re-run (probe 5): the model's own
# native `write`/`edit` calls reached bouncer directly (`aws-access-
# key-id: AWS access key id`), closing the original gap. `read.path`
# confirmed LIVE on omp only (plain and a trailing `:N-M` selector
# suffix, which rides unstripped inside the path string itself) — pi
# stays genuinely UNMEASURED: the tool-forced re-run still refused, this
# time explaining why (a content-based safety refusal on private key
# material, immune to which tool is named, review round 1 P-3), not
# "declined on its own safety judgment" as a bare assumption.
# `grep.path`/`.pattern` confirmed LIVE on omp, including the review
# round 1 tool-forced re-run's `;`-list form reaching a genuine
# model-issued call — pi stays genuinely UNMEASURED for a DIFFERENT,
# HONEST reason found live: the tool-forced re-run reported this
# session's own configured pi toolset exposes only `read`/`bash`/`edit`/
# `write` to the model, no `grep`/`find`/`ls` at all — a tool-
# availability fact of this one probe account, not a refusal. `glob.path`
# confirmed live on omp (pi has no `glob` tool at all — see the
# `[harness.protocol.tools]` comment below, P-2). `find`/`ls` (P-2,
# below) are correct against the installed package's OWN types but were
# never live-exercised by any probe, for the same tool-availability
# reason as `grep` above; ADR-0006 fact 5 (shared extension API) makes
# divergence on their own field names unlikely, not directly observed.
#
# `session_start`'s doctor context is delivered TWO ways by the shim
# (`policy/harness/pi-agent.shim.ts`'s own fixed rule, never a per-harness
# choice — see that file's header comment): `ctx.ui.notify` (immediate
# best-effort toast — measured live: renders as a startup warning banner
# under `pi` 0.84.1's TUI; NOT independently isolated under `omp`
# 18.1.10's TUI — the one live interactive `omp` run that showed a
# startup banner used a shim build where the second path below was
# already live too, and only that second path left hard proof in the
# session's own transcript, so this toast's presence specifically on
# `omp` stays unconfirmed either way, never disproven) AND a message
# queued for the session's FIRST `before_agent_start` turn (`customType:
# "bouncer-doctor"`, `display: true` — the same shape Claude Code's
# `UserPromptSubmit` `additionalContext` fills). The second path is
# CONFIRMED live TWO ways: headless (`-p`), directly, on BOTH binaries
# (a broken policy overlay's doctor text reached the model verbatim on
# `pi` AND `omp`, closing the earlier headless gap); and, on `omp`, from
# a REAL interactive session's own persisted transcript (a
# `custom_message` entry, `customType: "bouncer-doctor"`, matching this
# handler's own return shape exactly) — the banner Jonathan saw at the
# top of `omp`'s screen during probe 2 traces to THIS path, not
# (provably) the toast above; the strongest evidence of the two, since
# it is the harness's own recorded proof of delivery, not an operator's
# visual recollection. See the 15c report's "Doctor notices" evidence
# and `docs/how-to/wire-into-pi-agent.md`'s own section — one wording,
# copied here (review round 2 C-1).
#
# `expandPathCandidates` (`src/adapter/neutral-call.ts`, review round 1
# L-1, the lead's own finding): a selector suffix or `;`-list riding
# unstripped inside a `path` selector's raw value defeated every
# `$`-anchored path rule — probes 4/6 only ever tried `~/.ssh/id_rsa`,
# the one vector the DIRECTORY rule catches regardless of suffix, so the
# ticket's own original probes never met the trigger the brief named
# ("only if they DEFEAT the path rules"); the lead's own additional
# vectors (`~/.zsh_history:1-5`, `proj/secrets.pem:1-2`, `proj/.envrc;
# proj/README.md`) did. Fixed for every role="read" row on every
# harness (a harness-neutral property of the role, not pi-agent-only —
# see `docs/reference/policy.md` § harness and ADR-0006's own
# Consequences for the resulting Claude Code behavior change, review
# round 2 C-3); confirmed live on omp (review round 1 P-3 re-run: a real
# `;`-list `grep` call blocked).
#
# `edit`'s own hashline grammar (`[PATH#TAG]` section headers, `+` body
# rows only — never `-`/context/`CUT` rows, ADR-0006 § 6) is confirmed
# live and firsthand: this ticket's own dev session runs under
# omp/pi-agent, and ITS `edit` tool is exactly this grammar — not a
# secondhand doc reading. The `hashline` codec
# (`src/adapter/codecs/input/hashline.ts`) parses it the same way
# `apply-patch` parses Codex's own patch text: every `[PATH#TAG]` path,
# `text` = every `+` row across every section joined by `\n`.
#
# `confirm` is CONFIRMED live on BOTH binaries as of this comment
# (2026-09-08, pi 0.84.1 / omp 18.1.10). Headless half: probe 3
# (`scripts/probe-pi-agent.sh`), a temporary confirm="ask" probe build,
# genuinely separate subprocess launches on both binaries — `ctx.hasUI`
# is `false` in headless (`-p`) mode, the shim's own `ctx.hasUI ? await
# ctx.ui.confirm(...) : false` branch blocks the call without ever
# hanging (`git branch -D no-such-branch-zzz` → `git-protected: …
# confirm before running`, ~7-10s of ordinary model latency, never a
# timeout) — identical on `pi` and `omp`.
#
# Interactive half: probe 2, run in two SEPARATE live panes. `pi`
# (~20:39Z, session `01a082be-…`): dialog rendered, declined → tool
# blocked with bouncer's own reason, accepted → tool ran, two
# `git-protected` `confirm` log entries. `omp` (~21:12Z, session
# `01a082dd-…`, a fresh pane opened after killing every earlier probe
# process): same result — declined → blocked, accepted → ran — plus an
# absolute-path bypass attempt (`/usr/bin/git branch -D …`) still
# caught, and the model's own separate harness-native `ask` tool
# (unrelated to bouncer) preceding the bash call; four `git-protected`
# `confirm` log entries. Both session ids' own UUIDv7 timestamp bits
# decode to each run's own real start instant, confirming two genuinely
# separate processes (verified by hand, not assumed).
#
# A FIRST attempt at `omp`'s own half (~20:41Z, the SAME pane as `pi`'s
# run above) produced evidence that looked identical but was NOT
# genuine: both halves shared ONE session file with a single `session`/
# `model_change` header — the "run omp" instruction had been typed as a
# chat prompt into the still-running `pi` session, and bouncer blocked
# the nested command before any second process ever spawned. Recorded
# in full in the 15c report (§ "Probe 2, in detail") so the same
# mistake — trusting a matching rule name as proof of a second process —
# is never repeated: a shared or reused `session_id` between two
# supposedly independent runs is itself the tell.
[harness.protocol]
transport = "stdin-json"
wiring    = "shim-file"

[harness.protocol.input]
event   = "event"
tool    = "toolName"
input   = "input"
session = "session"
cwd     = "cwd"

[harness.protocol.events]
pre_tool      = "tool_call"
session_start = "session_start"

# name -> role + field selectors, on the SHIM's own event object (never
# omp/pi-agent's real extension event shape directly — the shim already
# flattened it into `{event, toolName, input, session, cwd}` before this
# table is ever consulted). `edit` names a codec instead of selectors —
# both binaries' own `edit` tool shape needs real parsing, not a field
# map (ADR-0006 § 6, mirroring Codex's `apply_patch` row); the `hashline`
# codec accepts omp's own `{input}` patch string AND pi's OWN
# structurally different `{path, edits[]}` shape (review round 1 P-1,
# `hashline.ts`'s own header comment cites the exact `.d.ts` lines).
#
# Review round 1 P-2: pi 0.84.1 has NO `glob` tool at all — verified
# against the installed package's own `.d.ts` files, not assumed:
# `dist/core/tools/index.d.ts:21`, `ToolName = "read"|"bash"|"edit"|
# "write"|"grep"|"find"|"ls"`. `find` (`{ pattern, path?, limit? }`,
# `find.d.ts:8-12`) and `ls` (`{ path?, limit? }`, `ls.d.ts:5-8`) are pi's
# own tools for the same job omp's `glob` does; `find`'s `pattern` is the
# glob string, its `path` an optional search root — both judged, same as
# `grep`'s own two-field row (`grep.d.ts:5-13` confirms `grep`'s field
# names were already exactly right: `pattern` required, `path` optional).
# `glob` stays declared for omp (ADR-0006 fact 5 does not make every TOOL
# identical, only the extension HOOK api — confirmed diverging for real
# by `edit` above); a row with no matching tool on a given binary is
# simply never reached, not an error.
[harness.protocol.tools]
bash = { role = "command", command = "command" }
read = { role = "read",    path = "path" }
write = { role = "write",  path = "path", text = "content" }
edit = { role = "write",   codec = "hashline" }
grep = { role = "read",    path = "path", pattern = "pattern" }
glob = { role = "read",    path = "path" }
find = { role = "read",    path = "path", pattern = "pattern" }
ls = { role = "read",      path = "path" }

[harness.protocol.output]
block = "deny"
confirm = "ask"
observe = "silent"
flag = "silent"
# on_malformed = "deny" (measured 2026-09-08, ticket 15c probe 10):
# neither binary sends a malformed envelope — the shim always writes
# well-formed JSON to bouncer's own stdin, so this is a considered
# decision, not a live-observed fact. Verified by hand-breaking stdin
# through the SOURCE binary's own `run --harness pi-agent` directly:
# `{}` (valid JSON, no `event` field) is silent — `run.ts`'s own
# unrecognized-event contract, never the `on_malformed` path at all —
# while genuinely empty/unreadable stdin renders this harness's own
# deny template with `envelope-malformed: unreadable or malformed
# hook envelope — failing closed`. Chosen fail-closed, matching
# `confirm`'s own posture: a harness whose shim already treats its own
# liveness failures as fail-closed (ADR-0006 § 7 rule 1) gains nothing
# from silently allowing a broken envelope through.
on_malformed = "deny"
ask_probe = "2026-09-08, pi 0.84.1 (session 01a082be-…, cmux pane) and omp 18.1.10 (session 01a082dd-…, a separate fresh pane) — both real ctx.ui.confirm dialogs, decline blocks/accept runs on both; see the 15c report's probe table and 'Probe 2, in detail' section"

[harness.protocol.output.deny]
stdout = '{"block":true,"reason":${reason}}'

[harness.protocol.output.ask]
stdout = '{"ask":true,"reason":${reason}}'

[harness.protocol.output.session_start]
stdout = '{"notify":${context}}'
