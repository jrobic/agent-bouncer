# Declarative assistant configuration directory. Protected-write rows are
# derived by src/policy/schema.ts before the hand-written protected-write
# policy rows. One file per assistant (ADR-0006 § 2) — this file's `id` is
# its own filename. See docs/reference/policy.md § harness.

# Source: Gemini CLI configuration documentation
[[harness]]
id = "gemini-cli"
dir = ["(^|/)\\.gemini"]
witness = "~/.gemini"
env = []
reason = "Gemini CLI configuration directory"

[[harness.persistent]]
id = "gemini-cli-settings"
path = "settings\\.json$"
reason = "Gemini CLI loads settings at session start"

[[harness.persistent]]
id = "gemini-cli-instructions"
path = "GEMINI\\.md$"
reason = "Gemini CLI reads instructions for future sessions"
