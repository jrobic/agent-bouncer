# bouncer baseline policy — mcp-write family (default-ask MCP tool calls;
# a call whose operation name starts with one of these prefixes is a
# silent read). See docs/reference/policy.md.
#
# Exact `allowed_tools` entries can approve one named tool on one named
# server without widening an identically named operation elsewhere.
[rules.mcp_write]
read_prefixes = [
    "get",
    "list",
    "search",
    "fetch",
    "read",
    "query",
    "lookup",
    "describe",
    "view",
  ]

allowed_tools = []
