# bouncer baseline policy — write-secret family (text about to be written
# that matches a known secret token shape). See docs/reference/policy.md
# for the rule row shape shared across every family.

[[rules.write_secret]]
id = "private-key"
regex = "-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----"
reason = "PEM/OpenSSH private key block"

[[rules.write_secret]]
id = "aws-access-key-id"
regex = "\\bAKIA[0-9A-Z]{16}\\b"
reason = "AWS access key id"

[[rules.write_secret]]
id = "github-pat"
regex = "\\bghp_[A-Za-z0-9]{36}\\b|\\bgithub_pat_[A-Za-z0-9_]{22,}\\b"
reason = "GitHub personal access token"

[[rules.write_secret]]
id = "github-token"
regex = "\\bgh[ousr]_[A-Za-z0-9]{36}\\b"
reason = "GitHub OAuth/app/refresh token"

[[rules.write_secret]]
id = "slack-token"
regex = "\\bxox[baprs]-[A-Za-z0-9-]{10,}\\b"
reason = "Slack token"

[[rules.write_secret]]
id = "google-api-key"
regex = "\\bAIza[0-9A-Za-z_-]{35}\\b"
reason = "Google API key"

[[rules.write_secret]]
id = "stripe-secret-key"
regex = "\\b(?:sk|rk)_live_[A-Za-z0-9]{24,}\\b"
reason = "Stripe live secret key"

[[rules.write_secret]]
id = "jwt"
regex = "\\beyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}\\b"
reason = "JSON Web Token (possible embedded credential)"

# The VALUE of a protected environment variable (not a token shape:
# an exact value read from the hook process's own environment, in clear, base64
# or hex). The engine owns the recognition — src/env-value-rules.ts, bound to
# the environment by src/adapter/dispatch.ts — and this row is what makes the
# guard visible in `rules list` and reachable by `[[override]]`: `disable`
# switches it off, `relax` softens its verdict. A row with `special` is never
# fired by the regex scan (no handler is bound there), so `regex` only gates
# which texts the guard looks at: `[\s\S]` accepts every non-empty text, and an
# `[[override]]` `replace` narrows it. The reason below is followed, at
# verdict time, by the NAME of each variable found — never its value.
# ADR-0008: the same row also redacts every tool's OUTPUT before
# the model sees it — one switch: `disable` or `relax` turns that off too. A
# `replace` governs writes only: the redaction ignores `regex` / `except` and
# always scans the whole output.
[[rules.write_secret]]
id = "env-value"
regex = "[\\s\\S]"
special = "env_value"
reason = "the text contains the value of a protected environment variable — reference the variable by name instead of writing its value ($NAME, process.env.NAME), or have the operator write it"
