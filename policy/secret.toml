# bouncer baseline policy — secret family (file paths and shell commands
# that read as secret-bearing). See docs/reference/policy.md for the rule
# row shape shared across every family.

[[rules.secret.path]]
id = "dotenv"
regex = "(^|/)\\.env[^/]*$"
reason = "dotenv and direnv .envrc files blocked (only .env.example and .env.test are allowed)"
except = "(^|/)\\.env\\.(example|test)$"

[[rules.secret.path]]
id = "crypto-key"
regex = "(^|/)[^/.][^/]*\\.(pem|key|pkey|crt|cert|pfx|p12|jks|keystore|gpg|asc|kdbx|kbx|agekey|ovpn)$"
flags = "i"
reason = "Cryptographic key/certificate file blocked"

# Ticket 24: an age identity is the private key for every sops-encrypted
# production override. Decryption belongs to the human's own terminal.
[[rules.secret.path]]
id = "age-identity"
regex = "(^|/)sops/age/[^/]+$|(^|/)age/keys\\.txt$"
reason = "age identity file — the private key that decrypts every sops-encrypted secret"

[[rules.secret.path]]
id = "ssh-key"
regex = "(^|/)id_(rsa|dsa|ecdsa|ed25519)(\\.pub)?$"
reason = "SSH key file blocked"

[[rules.secret.path]]
id = "aws-creds"
regex = "(^|/)\\.aws(/|$)"
reason = "AWS home directory blocked — credentials, config and the sso/cli caches hold live tokens"

[[rules.secret.path]]
id = "netrc-pgpass"
regex = "(^|/)\\.(netrc|pgpass)$"
reason = ".netrc/.pgpass blocked"

[[rules.secret.path]]
id = "cloud-sa"
regex = "(service-account|firebase-adminsdk|gcp-key)[^/]*\\.json$"
flags = "i"
reason = "Cloud service-account JSON blocked"

[[rules.secret.path]]
id = "tfstate"
regex = "\\.tfstate(\\.backup)?$|\\.terraform\\.tfstate\\.lock\\.info$"
reason = "Terraform state file blocked (often contains plaintext secrets)"

[[rules.secret.path]]
id = "npmrc"
regex = "(^|/)\\.npmrc$"
reason = ".npmrc blocked outside node_modules/ (may contain _authToken)"
except = "/node_modules/"

[[rules.secret.path]]
id = "gitconfig"
regex = "(^|/)\\.gitconfig$"
reason = ".gitconfig blocked (may contain [credential] tokens or signing keys)"

# Ticket 13: confirm rather than block — protects by default without
# stopping a legitimate read outright.
[[rules.secret.path]]
id = "transcript-backup"
regex = "(^|/)\\.claude/transcripts(/|$)"
reason = "transcript backup directory blocked (contains full session history)"
verdict = "confirm"

# The binary's own audit log (denial history is reconnaissance): confirm
# not block, same reasoning as transcript-backup — `bouncer audit` is the
# sanctioned read path and never reaches this guard. Known limit: matches
# the file path (and its `.log.1` rotation sibling), not a directory or
# glob read of `logs/hooks/`.
[[rules.secret.path]]
id = "bouncer-audit-log"
regex = "(^|/)logs/hooks/bouncer\\.log(\\.1)?$"
reason = "bouncer's own audit log — denial/confirm history is reconnaissance for a compromised agent"
verdict = "confirm"

[[rules.secret.path]]
id = "secret-dir"
regex = "(^|/)(\\.?secrets|credentials)(/|$)"
reason = "Path inside secrets/ or credentials/ directory blocked"

[[rules.secret.path]]
id = "ssh-dir"
regex = "(^|/)\\.ssh(/|$)"
reason = ".ssh directory blocked"

[[rules.secret.path]]
id = "gnupg-dir"
regex = "(^|/)\\.gnupg(/|$)"
reason = ".gnupg directory blocked"

# Ticket 31: confirm rather than block — shell history can contain inline
# credentials, but "what did I type yesterday?" remains a legitimate request.
[[rules.secret.path]]
id = "shell-history"
regex = "(^|/)\\.(?:zsh_history|bash_history|zhistory|python_history|node_repl_history|psql_history|mysql_history|lesshst)$"
reason = "shell history file may retain commands with inline credentials"
verdict = "confirm"

# Ticket 31: confirm rather than block — every Claude Code profile has live
# session JSONL with prompts and command history; an observer may be granted
# a profile-specific relaxation without exposing memory notes.
[[rules.secret.path]]
id = "session-transcripts"
regex = "(^|/)\\.claude(?:-[A-Za-z0-9_-]+)?/projects/[^/]+/[^/]+\\.jsonl$"
reason = "live Claude Code session transcript can expose prompts and command history"
verdict = "confirm"

# Ticket 24: decryption reveals plaintext secret values. Decrypt, exec-env
# and edit are human acts in the human's terminal, not the agent's.
# Known limits: a sops command hidden behind a package script or run by
# direnv is not a literal command match; production decryption scripts stay
# human-run. Plaintext inherited from the agent's launch environment is also
# out of scope by construction. A non-default SOPS_AGE_KEY_FILE is a human
# choice; a personal overlay row names it.
[[rules.secret.bash]]
id = "sops-decrypt"
regex = "\\bsops(?:\\s+[^;&|\\n]*)?\\s(?:-d|--decrypt|decrypt|exec-env|exec-file|edit)(?:\\s|$)|(?:^|[;&|(]\\s*)(?:(?:[A-Za-z_][A-Za-z0-9_]*=\\S*|rtk|command|exec|env|nice|time|builtin|proxy)\\s+)*sops\\s+[^\\s;&|\\-][^\\s;&|]*\\s*(?:$|[;&|)])"
reason = "sops decryption reveals plaintext secret values — decrypt/exec-env/edit are a human act in the human's terminal, not the agent's"

# Debatable (ticket 24): age is general-purpose; a consumer may relax this
# baseline block to confirm in a local override with its reason.
[[rules.secret.bash]]
id = "age-decrypt"
regex = "\\b(?:age|rage)(?:\\s+[^;&|\\n]*)?\\s(?:-d|--decrypt)(?:\\s|$)"
reason = "age decryption reveals plaintext secret values — decrypt is a human act in the human's terminal, not the agent's"

[[rules.secret.bash]]
id = "bash-git-leak-credential"
regex = "\\bgit\\s+config\\b[^\\n]*\\b(credential|user\\.signingkey)\\b"
reason = "git command may leak credentials (tokens in remote URLs, signing keys, credential helpers)"

[[rules.secret.bash]]
id = "bash-git-leak-remote-url"
regex = "\\bgit\\s+config\\b[^\\n]*\\bremote\\.[^\\s]+\\.url\\b"
reason = "git command may leak credentials (tokens in remote URLs, signing keys, credential helpers)"
special = "git_remote_url"

[[rules.secret.bash]]
id = "bash-url-creds"
regex = "\\b(?:https?|git|ssh|ftp):\\/\\/[^\\s/@:]+:[^\\s/@]+@"
reason = "URL contains embedded user:password credentials (likely token leak)"

[[rules.secret.bash]]
id = "keychain-dump"
regex = "\\bsecurity\\s+(?:find-(?:generic|internet)-password|export|dump-keychain)\\b"
reason = "macOS Security command can print a password or private key in cleartext"

# Ticket 31: confirm rather than block — emitting a short-lived credential
# into a local command is sometimes legitimate, while transcript exposure
# needs a human decision.
[[rules.secret.bash]]
id = "credential-printer"
regex = "\\bgh\\s+auth\\s+token\\b|\\bglab\\s+auth\\s+status\\b[^|;&\\n]*\\s--show-token\\b|\\bop\\s+read\\b|\\bop\\s+item\\s+get\\b[^|;&\\n]*\\s(?:--reveal|--fields)\\b|\\bgcloud\\s+auth\\s+print-(?:access|identity)-token\\b|\\baws\\s+sts\\s+(?:get-session-token|assume-role)\\b|\\bvault\\s+(?:read|kv\\s+get)\\b|\\bdoppler\\s+secrets\\s+download\\b"
reason = "command can emit a live credential to the terminal"
verdict = "confirm"
