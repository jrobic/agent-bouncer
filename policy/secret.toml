# bouncer baseline policy — secret family (file paths and shell commands
# that read as secret-bearing). See docs/reference/policy.md for the rule
# row shape shared across every family.

[[rules.secret.path]]
id = "dotenv"
regex = "(^|/)\\.env[^/]*$"
reason = "dotenv and direnv .envrc files blocked (only .env.example and .env.test are allowed)"
except = "(^|/)\\.env\\.(example|test)$"

[[rules.secret.path]]
id = "crypto-key"
regex = "(^|/)[^/.][^/]*\\.(pem|key|pkey|crt|cert|pfx|p12|jks|keystore|gpg|asc|kdbx|kbx|agekey|ovpn)$"
flags = "i"
reason = "Cryptographic key/certificate file blocked"

# Ticket 24: an age identity is the private key for every sops-encrypted
# production override. Decryption belongs in the operator's terminal.
[[rules.secret.path]]
id = "age-identity"
regex = "(^|/)sops/age/[^/]+$|(^|/)age/keys\\.txt$"
reason = "age identity file — the private key that decrypts every sops-encrypted secret"

[[rules.secret.path]]
id = "ssh-key"
regex = "(^|/)id_(rsa|dsa|ecdsa|ed25519)(\\.pub)?$"
reason = "SSH key file blocked"

[[rules.secret.path]]
id = "aws-creds"
regex = "(^|/)\\.aws(/|$)"
reason = "AWS home directory blocked — credentials, config and the sso/cli caches hold live tokens"

[[rules.secret.path]]
id = "netrc-pgpass"
regex = "(^|/)\\.(netrc|pgpass)$"
reason = ".netrc/.pgpass blocked"

[[rules.secret.path]]
id = "cloud-sa"
regex = "(service-account|firebase-adminsdk|gcp-key)[^/]*\\.json$"
flags = "i"
reason = "Cloud service-account JSON blocked"

[[rules.secret.path]]
id = "tfstate"
regex = "\\.tfstate(\\.backup)?$|\\.terraform\\.tfstate\\.lock\\.info$"
reason = "Terraform state file blocked (often contains plaintext secrets)"

[[rules.secret.path]]
id = "npmrc"
regex = "(^|/)\\.npmrc$"
reason = ".npmrc blocked outside node_modules/ (may contain _authToken)"
except = "/node_modules/"

[[rules.secret.path]]
id = "gitconfig"
regex = "(^|/)\\.gitconfig$"
reason = ".gitconfig blocked (may contain [credential] tokens or signing keys)"

# Ticket 13: confirm rather than block — protects by default without
# stopping a legitimate read outright.
[[rules.secret.path]]
id = "transcript-backup"
regex = "(^|/)\\.claude/transcripts(/|$)"
reason = "transcript backup directory blocked (contains full session history)"
verdict = "confirm"

# The binary's own audit log (denial history is reconnaissance): confirm
# not block, same reasoning as transcript-backup — `bouncer audit` is the
# sanctioned read path and never reaches this guard. Known limit: matches
# the file path (and its `.log.1` rotation sibling), not a directory or
# glob read of `logs/hooks/`.
[[rules.secret.path]]
id = "bouncer-audit-log"
regex = "(^|/)logs/hooks/bouncer\\.log(\\.1)?$"
reason = "bouncer's own audit log — denial/confirm history is reconnaissance for a compromised agent"
verdict = "confirm"

[[rules.secret.path]]
id = "secret-dir"
regex = "(^|/)(\\.?secrets|credentials)(/|$)"
reason = "Path inside secrets/ or credentials/ directory blocked"

[[rules.secret.path]]
id = "ssh-dir"
regex = "(^|/)\\.ssh(/|$)"
reason = ".ssh directory blocked"

[[rules.secret.path]]
id = "gnupg-dir"
regex = "(^|/)\\.gnupg(/|$)"
reason = ".gnupg directory blocked"

# Ticket 31: confirm rather than block — shell history can contain inline
# credentials, but "what did I type yesterday?" remains a legitimate request.
[[rules.secret.path]]
id = "shell-history"
regex = "(^|/)(?:\\.(?:zsh_history|bash_history|zhistory|python_history|node_repl_history|psql_history|mysql_history|lesshst)|fish_history)$"
reason = "shell history file may retain commands with inline credentials"
verdict = "confirm"

# Ticket 31: confirm rather than block — every Claude Code profile has live
# session JSONL with prompts and command history; an observer may be granted
# a profile-specific relaxation without exposing memory notes.
[[rules.secret.path]]
id = "session-transcripts"
regex = "(^|/)\\.claude(?:-[A-Za-z0-9_-]+)?/projects/[^/]+/[^/]+\\.jsonl(?:\\.[\\w-]+)?$"
reason = "live Claude Code session transcript can expose prompts and command history"
verdict = "confirm"

# Ticket 57: a process's environment as a file. `self` and `thread-self`
# resolve to the caller, a numeric pid or `task/<tid>` to another process
# (the Read tool canonicalises first, so a Linux `/proc/self/environ`
# arrives as `/proc/<pid>/environ`). Reached from Bash through the path
# scan (`cat /proc/self/environ` is `bash-proc-environ`); a pid built with
# a shell variable (`/proc/$$/environ`) is not resolved before scanning,
# like every other variable-expanded path.
[[rules.secret.path]]
id = "proc-environ"
regex = "(^|/)proc/(?:self|thread-self|\\d+)/(?:task/\\d+/)?environ$"
reason = "a process's environment (/proc/<pid>/environ) holds the secrets it was launched with"

# Ticket 24: decryption reveals plaintext secret values. Decrypt, exec-env
# and edit are operator actions in the operator's terminal, not the agent's.
# Known limits: a sops command hidden behind a package script or run by
# direnv is not a literal command match; production decryption scripts stay
# operator-run. Plaintext already in the agent's launch environment (a sops
# exec-env the launcher ran) is not this row's business: Bouncer cannot
# remove a variable, and the `env-*` rows below only refuse the commands
# that print or reference one — a net, not a barrier. A non-default
# SOPS_AGE_KEY_FILE is an operator choice; a personal overlay row names it.
[[rules.secret.bash]]
id = "sops-decrypt"
regex = "\\bsops(?:\\s+[^;&|\\n]*)?\\s(?:-d|--decrypt|decrypt|exec-env|exec-file|edit)(?:\\s|$)|(?:^|[;&|(]\\s*)(?:(?:[A-Za-z_][A-Za-z0-9_]*=\\S*|rtk|command|exec|env|nice|time|builtin|proxy)\\s+)*sops\\s+[^\\s;&|\\-][^\\s;&|]*\\s*(?:$|[;&|)])"
reason = "sops decryption reveals plaintext secret values — decrypt/exec-env/edit are operator actions in the operator's terminal, not the agent's"

# Debatable (ticket 24): age is general-purpose; a consumer may relax this
# baseline block to confirm in a local override with its reason.
[[rules.secret.bash]]
id = "age-decrypt"
regex = "\\b(?:age|rage)(?:\\s+[^;&|\\n]*)?\\s(?:-d|--decrypt)(?:\\s|$)"
reason = "age decryption reveals plaintext secret values — decrypt is an operator action in the operator's terminal, not the agent's"

[[rules.secret.bash]]
id = "bash-git-leak-credential"
regex = "\\bgit\\s+config\\b[^\\n]*\\b(credential|user\\.signingkey)\\b"
reason = "git command may leak credentials (tokens in remote URLs, signing keys, credential helpers)"

[[rules.secret.bash]]
id = "bash-git-leak-remote-url"
regex = "\\bgit\\s+config\\b[^\\n]*\\bremote\\.[^\\s]+\\.url\\b"
reason = "git command may leak credentials (tokens in remote URLs, signing keys, credential helpers)"
special = "git_remote_url"

[[rules.secret.bash]]
id = "bash-url-creds"
regex = "\\b(?:https?|git|ssh|ftp):\\/\\/[^\\s/@:]+:[^\\s/@]+@"
reason = "URL contains embedded user:password credentials (likely token leak)"

[[rules.secret.bash]]
id = "keychain-dump"
regex = "\\bsecurity\\s+(?:find-(?:generic|internet)-password|export|dump-keychain)\\b"
except = "^\\s*security\\s+find-generic-password(?:\\s+-(?:a|c|C|D|G|j|l|s)\\s+[^\\s|;&<>-][^\\s|;&<>]*)*(?:\\s+[^\\s|;&<>-][^\\s|;&<>]*)?\\s*$"
reason = "macOS Security command can print a password or private key in cleartext"

# The environment rows. The agent's own environment holds what
# its launcher exported (direnv, a profile, a CI runner). Bouncer cannot
# remove a variable: these rows only refuse the commands that print or
# reference one — a net, not a barrier (docs/reference/policy.md, "The
# environment rows"). Block rows come BEFORE confirm rows on purpose: the
# first matching row of the table wins, so a confirm placed first would
# hide a block later in the same command. Regexes below are TOML literal
# strings (single quotes, no escape processing); `\x27` is an apostrophe.
# A `{{name}}` in them is a shared fragment (src/policy/fragments.ts — the
# protected-name definition among them), filled in once at load time: the
# effective regex is what `bouncer rules list` and the frozen digest show,
# and an overlay row never writes one (lint rejects it). Every open-ended
# run is bounded, so a long command cannot drive a row quadratic.
#
# Dumps of the whole environment. Anatomy of `env-dump`'s regex:
#   {{command-position}} — a command start (start of text, `;` `&` `&&`
#     newline `{` backtick `$(` `<(` `>(`, a pipe preceded by whitespace so
#     that `a|env` inside a search pattern is not a pipeline, `then` `do` …,
#     the argument of any shell `-c`), then up to eight `(`, then up to eight
#     prefixes (`VAR=value` `rtk` `command` `exec` `nice` `time` `builtin`
#     `proxy` `eval` `!`) and wrappers read with the shape of their arguments
#     (`nohup` `timeout` `xargs` `env` `watch`); a prefix or a wrapper may
#     carry a path; a value it reads holds at most 256 characters
#   then {{env-dump-command}} — `env` with only options and assignments
#     (nothing to run); `printenv` with no variable name; `export [-p]`;
#     `declare` or `typeset` with only -x/-p flags (or none); `set` alone —
#     followed by {{env-dump-end}}, the end of the segment (`;` `&` `|` `)`
#     backtick, newline, `#`, a redirection); a lone `}` is not an end: in
#     `{ env }` it is an argument of env; or `compgen -e` / `-A export`
#   or — after a command position, the quote that its last wrapper `eval`,
#     `env -S` or `watch` opened ({{reread-open}}), then the same command
#     ended by its closing quotes; or the quoted argument of a shell `-c`
#     ({{shell-c-open}}), then the command up to its closing quote. A quote
#     ends a command only there: `echo "a&env"` and a URL that holds `&env`
#     are not dumps
#   or — `${!PREFIX@}` and `${!PREFIX*}` (the names of matching variables)
# `env FOO=1 make`, `set -e`, `export FOO=bar`, `declare -x FOO=bar` and
# `git remote set-url` run or assign something and never match. The
# `except` keeps a URL (a fetch target, not a command) out, and a line handed
# whole to another machine ({{remote-command-line}}, shared by the five
# dump rows): `ssh` or `limactl shell` with no local expansion or separator,
# and no word `command` (ssh's `ProxyCommand` and `LocalCommand` run here).
[[rules.secret.bash]]
id = "env-dump"
regex = '(?:{{command-position}}(?:{{env-dump-command}}{{env-dump-end}}|compgen[ \t]+(?:-[a-zA-Z]*e[a-zA-Z]*|-A[ \t]+export)(?:[ \t]|$|[;&|)}`\n#<>])|{{reread-open}}{{env-dump-command}}["\x27](?:[ \t]*["\x27]){0,7}[ \t]*{{env-dump-end}})|{{shell-c-open}}{{env-dump-command}}["\x27]|\$\{![A-Za-z_][A-Za-z0-9_]*[@*]\})'
except = '^[ \t]*[A-Za-z][A-Za-z0-9+.-]*://\S*[ \t]*$|{{remote-command-line}}'
reason = "prints the whole process environment, where the secrets the agent was launched with live — name the one variable you need to the operator, or run the command that needs it instead of printing the lot"

# `ps` showing a process's environment: the BSD `e` operand (no dash:
# `ps e`, `ps eww`, `ps auxe`) and macOS's `-E`. `ps -ef`, `ps -e` and
# `ps aux` list processes and print no environment (on macOS `-e` is `-A`,
# on Linux "every process"), so a flag cluster is never scanned for `e`:
# only the dashless FIRST operand is, and `-E` as a capital. `ps` must sit
# at command position (the same lead-in as `env-dump`): `docker compose ps
# postgres` and a commit message that says `ps output` are not `ps`. A
# `grep -E` after a pipe is not `ps -E`: the scan stops at the pipe.
[[rules.secret.bash]]
id = "env-dump-ps"
regex = '{{command-position}}(?:[\w./~-]*/)?ps[ \t]+(?:[a-zA-Z]*e[a-zA-Z]*(?:[ \t]|$|[;&|)}`"\x27])|(?:[^\s|;&]+[ \t]+){0,40}-[a-zA-Z]*E[a-zA-Z]*(?:[ \t]|$|[;&|)}`"\x27]))'
except = '{{remote-command-line}}'
reason = "ps prints the environment of a process (BSD `e`, macOS `-E`) — the secrets it was launched with included; `ps -ef` and `ps aux` do not and stay allowed"

# Launchd's own environment, which a launcher may have seeded with secrets.
# At command position (the same lead-in as `env-dump`, a path prefix
# allowed): a search or a sentence that spells `launchctl getenv` is not the
# command.
[[rules.secret.bash]]
id = "env-dump-launchctl"
regex = '{{command-position}}(?:[\w./~-]*/)?launchctl[ \t]+getenv\b'
except = '{{remote-command-line}}'
reason = "launchctl getenv reads the launchd user environment, which a launcher may have seeded with secrets"

# jq's `env` / `$ENV` builtins read the whole environment. jq must sit at
# command position (the shared `env-dump` lead-in): a commit message or
# search that merely says `jq -n env` is not the command. `.env`
# is a field accessor (`jq '.scripts.env'`), `{env: …}` is
# an object key, `env.NAME` names one variable (a non-protected name is
# allowed; a protected one is `env-ref-display`), and a `| grep env` after
# the program is not jq: the lead-in ({{jq-lead}}) skips quoted strings
# whole, so a `|` inside the program is fine and a `|` outside it ends the
# scan, and it reaches at most 200 units. Three readings of the same
# sentence: `env` as a bare argument, inside a single-quoted program, inside
# a double-quoted one. One known false positive stays: a string literal
# INSIDE the program that holds `|env ` cannot be told from the builtin.
[[rules.secret.bash]]
id = "env-dump-jq"
regex = '{{command-position}}(?:[\w./~-]*/)?{{jq-lead}}(?:[ \t]|\x27(?:[^\x27]*[^.\w$\x27-])?|"(?:[^"]*[^.\w$"-])?){{jq-env}}'
except = '{{remote-command-line}}'
reason = "jq's env / $ENV reads the whole process environment"

# `docker exec … env|printenv` with nothing after it (a container's
# environment), and `docker compose config` as the compose subcommand (the
# resolved model, interpolated values included). `docker` must sit at command
# position (the `env-dump` lead-in, a path prefix allowed): a sentence or a
# search that merely says `docker compose config` is not the command.
# Compose global options before the subcommand are skipped, so `config` as an
# argument of `exec` (`docker compose exec lab herdr config check`) is not the
# subcommand. What FOLLOWS `config` must be printing flags or plain words
# (service names) up to the end of the segment: `-q` / `--quiet` /
# `--services` / `--volumes` / `--profiles` / `--images` / `--hash`, which
# print no environment, match nothing (a positive list, because the dialect
# has no lookaround), and `config -q; docker compose config` still matches
# its second segment. A flag this list does not know is not matched either.
# `docker run … env` and `kubectl exec … env` are not covered: see
# docs/reference/policy.md, "The environment rows".
[[rules.secret.bash]]
id = "env-dump-docker"
regex = '{{command-position}}(?:[\w./~-]*/)?docker(?:\b[^;&|\n]{0,150}\bexec\b[^;&|\n]{0,150}[ \t](?:env|printenv)(?:[ \t]+(?:-\S+|--)){0,10}|(?:[ \t]+compose|-compose)(?:[ \t]+(?:(?:-f|-p|--(?:file|project-name|project-directory|env-file|profile|parallel|progress|ansi))[ \t]+\S+|-\S+)){0,20}[ \t]+config(?:[ \t]+(?:--(?:no-interpolate|no-normalize|no-consistency|no-path-resolution|no-env-resolution|resolve-image-digests|lock-image-digests|environment|dry-run)|(?:--format|--output|-o)(?:[ \t]+|=)\S+|[^-\s;&|)`][^\s;&|)`]*)){0,30})[ \t]*(?:$|[;&|)}`\n#<>]|\d[<>])'
except = '{{remote-command-line}}'
reason = "prints a container's environment (docker exec … env, docker compose config), where its secrets live"

# References to a protected variable name — the definition lives in
# src/protected-names.ts and is written `{{protected-name}}` here; the forms
# an agent reads one in are the fragment `{{env-reference}}` (src/policy/
# fragments.ts): `$NAME` `${NAME}` (shell); `process.env.NAME`
# `process.env["NAME"]` `Bun.env.NAME` `Deno.env.get("NAME")` (JS);
# `os.environ["NAME"]` `os.environ.get("NAME")` `os.getenv("NAME")` (Python);
# `ENV["NAME"]` `ENV.fetch("NAME")` (Ruby); `ENVIRON["NAME"]` (awk);
# `getenv("NAME")` `os.Getenv` `env::var` (C family, PHP, Go, Rust …).
# The reference feeds a DISPLAY when echo / printf / print / println / puts /
# pp / console.log|info|… (or `node|bun -p`) precedes it in the same
# statement — no `;` `&` `|` or newline between, a `\`-newline continuation
# crossed, at most 400 characters ahead — and that is a block, since the
# value would land in the transcript. `printenv … NAME`, `declare|typeset
# -p … NAME` and jq's `env.NAME` / `$ENV.NAME` print by nature and block
# without a display word. Every other reference (an `Authorization` header,
# an alias, a commit message) is `env-ref` below, a confirm.
[[rules.secret.bash]]
id = "env-ref-display"
regex = '(?:\b(?:echo|[Pp]rint(?:f|ln)?|puts|pp|console\.(?:log|info|warn|error|debug)|(?:node|bun)[ \t]+(?:-[^\s;&|]+[ \t]+){0,10}(?:-p|-pe|--print))\b(?:\\\n|[^;&|\n]){0,400}{{env-reference}}|\bprintenv\b(?:\\\n|[^;&|\n]){0,400}?[ \t]["\x27]?|\b(?:declare|typeset)[ \t]+-[a-zA-Z]*p[a-zA-Z]*(?:\\\n|[^;&|\n]){0,400}?[ \t]["\x27]?|\b(?:go)?jq\b[^;&\n]{0,400}[^.\w$-](?:env|\$ENV)\.["]?){{protected-name}}\b'
reason = "prints the value of a protected variable (a name ending in TOKEN, PASSWORD, SECRET, API_KEY, …) into the transcript — use it without printing it, or ask the operator"

# Whole-environment access: the environment OBJECT (`process.env`,
# `Bun.env`, `Deno.env.toObject()`, `os.environ`, awk's `ENVIRON`, Ruby's
# `ENV` printed or enumerated) used as a whole — dumped, iterated, spread
# into a child's environment — because a protected name rebuilt at runtime
# slips past every name row. `process.env.NODE_ENV` and `os.environ["HOME"]`
# are properties, not the object, and stay allowed. The left boundary skips
# `.`, `#`, `/`, `$` (a URL fragment, a path, `$ENV`) but takes the `...`
# spread. The `except` lets a SEARCH name the object — a pattern is not an
# access: the whole command must be a sequence of searches (rg, grep, git
# grep|log|diff|show, …) and harmless readers, `cd`, a literal `echo`,
# without a command substitution, so `rg 'process.env' src && node -p
# process.env` is still blocked. Its pieces never overlap (a segment's
# trailing spaces belong to exactly one of them), which keeps it linear. A
# fetched URL is not code either.
[[rules.secret.bash]]
id = "env-ref-whole"
regex = '(?:^|[^\w.#/$-]|\.\.\.)(?:(?:process\.env|Bun\.env)(?:[^\w.\[?$]|$)|Deno\.env\.toObject\b|os\.environ(?:[^\w.\[$]|$|\.(?:copy|items|keys|values|iteritems|iterkeys|itervalues|as_dict|to_dict|update|clear|popitem)\b)|ENV\.(?:to_h|to_hash|to_a|each|each_pair|keys|values|inspect|to_s|select|filter|reject|map|sort|dup|clone|slice|merge|update|replace|filter_map|collect)\b|(?:puts|print|pp?)[ \t(]+ENV(?:[^\w.\[$=:/-]|$)|ENVIRON(?:[^\w.\[$=:/\s-]|$))'
except = '^[ \t]*(?:(?:(?:cd|pushd)[ \t]+(?:"[^"$`]*"|\x27[^\x27]*\x27|[^\s;&|"\x27$`]+)[ \t]*|echo(?:[ \t]+(?:"[^"$`]*"|\x27[^\x27]*\x27|[^\s;&|"\x27$`]+))*[ \t]*|(?:rtk[ \t]+)?(?:git[ \t]+(?:-[^\s;&|]+[ \t]+)*(?:grep|log|diff|show)|(?:[\w./~-]*/)?(?:rg|grep|egrep|fgrep|ag|ack|ls|cat|head|tail|sed|wc|sort|uniq|cut|tr|nl|less|stat|pwd|true))\b(?:[^;&|\n"\x27`$]|\$[^(]|&[>0-9]|"(?:[^"$`]|\$[^(])*"|\x27[^\x27]*\x27)*)(?:(?:;|&&|\|\|?)[ \t]*|$))+$|^[ \t]*[A-Za-z][A-Za-z0-9+.-]*://\S*[ \t]*$'
reason = "reads the whole environment (process.env, os.environ, ENV, ENVIRON), where the secrets the agent was launched with live — name the one variable you need instead of the lot"

# A name computed at runtime — `os.environ.get(<expr>)`, `process.env[<expr>]`,
# `ENV[<expr>]`, `getenv(<expr>)`, shell `${!name}` or `printenv $name` —
# counts as whole-environment access: a name rebuilt from `chr(65)+chr(84)`
# or `'AT'+'LASSIAN_TOKEN'` would otherwise slip past every name row. A
# literal name is a closed string right after the bracket or parenthesis
# (`["NAME"]`, `("NAME", default)`), possibly with its quotes backslash-
# escaped inside a shell string; anything else is computed. The object and
# call lists are the fragments `{{env-object}}` and `{{env-call}}`, the same
# ones the reference forms use.
[[rules.secret.bash]]
id = "env-ref-computed"
regex = '\b{{env-object}}[ \t]*\??\.?\[[ \t]*(?:[^ \t"\x27\\\]]|\\{0,3}["\x27][^"\x27\\\]]*\\{0,3}["\x27][ \t]*[^ \t\]])|\b{{env-call}}[ \t]*\([ \t]*(?:[^ \t"\x27\\)]|\\{0,3}["\x27][^"\x27\\)]*\\{0,3}["\x27][ \t]*[^ \t,)])|\$\{![A-Za-z_][A-Za-z0-9_]*\}|\bprintenv[ \t]+["\x27]?\$'
reason = "reads an environment variable by a name computed at runtime, which no name rule can see — spell a non-protected name out, or ask the operator"

# Confirm rows come after every block row (first match wins).
#
# The dump rows read at most eight prefixes and wrappers in front of a
# command, at most eight options of env, timeout, xargs, watch or a shell,
# and values of at most 256 characters; past that bound they cannot tell
# what runs. This row asks instead of letting the command through
# ({{unjudged-command}}: a ninth prefix or wrapper at a command position, a
# ninth option of env, timeout, xargs or watch there, or a ninth option of a
# shell anywhere; a longer value in a prefix assignment that a command
# follows, or in an option of env, timeout, xargs, watch, nice or a shell).
# `nice` nine times then `env`, or `bash` with nine options before `-c env`,
# asks; eight pass to the dump rows. A line handed whole to another machine
# is not read, as for the dump rows.
[[rules.secret.bash]]
id = "env-dump-unjudged"
regex = '{{unjudged-command}}'
except = '{{remote-command-line}}'
reason = "the command cannot be judged: more than eight prefixes, wrappers or options, or a value longer than 256 characters, stand in front of it, past what the environment rows read — shorten the command, or confirm it does not print the environment"
verdict = "confirm"

# `docker inspect` prints Config.Env: confirm, not block — inspecting a
# container is everyday work, and a `--format` template cannot be told safe
# from `{{json .Config}}` by a regex.
[[rules.secret.bash]]
id = "env-dump-docker-inspect"
regex = '\bdocker[ \t]+(?:container[ \t]+)?inspect\b'
reason = "docker inspect prints a container's configuration, its environment variables included — confirm before reading it"
verdict = "confirm"

# The same references that do not feed a display: confirm — an
# `Authorization: Bearer $SONARQUBE_TOKEN` header is legitimate use, a
# commit message or a heredoc that spells a protected name is accepted
# cost (the gate reads command text, not intent), and a human decides.
[[rules.secret.bash]]
id = "env-ref"
regex = '{{env-reference}}{{protected-name}}\b'
reason = "references a protected variable (a name ending in TOKEN, PASSWORD, SECRET, API_KEY, …) — confirm its value goes where it should and is not printed"
verdict = "confirm"

# Ticket 31: confirm rather than block — emitting a short-lived credential
# into a local command is sometimes legitimate, while transcript exposure
# needs a human decision. Ticket 57 completes the list (same row, same id: a
# consumer overlay that relaxed it keeps working): the short `-t` of
# `gh|glab auth status` (the long `--show-token` was already caught),
# `glab config get token`, `git credential fill`, `docker-credential-*
# get`, `npm|pnpm config get …_auth[Token]`, and the AWS CLI's
# `configure get` of a secret value or session token and
# `configure export-credentials`.
[[rules.secret.bash]]
id = "credential-printer"
regex = "\\bgh\\s+auth\\s+token\\b|\\b(?:gh|glab)\\s+auth\\s+status\\b[^|;&\\n]*\\s(?:--show-token|-[a-zA-Z]*t[a-zA-Z]*)\\b|\\bop\\s+read\\b|\\bop\\s+item\\s+get\\b[^|;&\\n]*\\s(?:--reveal|--fields)\\b|\\bgcloud\\s+auth\\s+print-(?:access|identity)-token\\b|\\baws\\s+sts\\s+(?:get-session-token|assume-role)\\b|\\bvault\\s+(?:read|kv\\s+get)\\b|\\bdoppler\\s+secrets\\s+download\\b|\\bglab\\s+config\\s+get\\b[^|;&\\n]*\\btoken\\b|\\bgit\\s+credential\\s+fill\\b|\\bdocker-credential-[A-Za-z0-9._-]+\\s+get\\b|\\b(?:npm|pnpm)\\s+config\\s+get\\b[^|;&\\n]*_auth(?:Token)?\\b|\\baws\\s+configure\\s+(?:get\\b[^|;&\\n]*\\baws_(?:secret_access_key|session_token)\\b|export-credentials\\b)"
reason = "command can emit a live credential to the terminal"
verdict = "confirm"
