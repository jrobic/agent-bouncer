# bouncer baseline policy — secret family (file paths and shell commands
# that read as secret-bearing). See docs/reference/policy.md for the rule
# row shape shared across every family.

[[rules.secret.path]]
id = "dotenv"
regex = "(^|/)\\.env[^/]*$"
reason = ".env file blocked (only .env.example and .env.test are allowed)"
except = "(^|/)\\.env\\.(example|test)$"

[[rules.secret.path]]
id = "crypto-key"
regex = "(^|/)[^/.][^/]*\\.(pem|key|pkey|crt|cert|pfx|p12|jks|keystore|gpg|asc|kdbx|kbx|agekey|ovpn)$"
flags = "i"
reason = "Cryptographic key/certificate file blocked"

[[rules.secret.path]]
id = "ssh-key"
regex = "(^|/)id_(rsa|dsa|ecdsa|ed25519)(\\.pub)?$"
reason = "SSH key file blocked"

[[rules.secret.path]]
id = "aws-creds"
regex = "(^|/)\\.aws/(credentials|config)$"
reason = "AWS credentials/config blocked"

[[rules.secret.path]]
id = "netrc-pgpass"
regex = "(^|/)\\.(netrc|pgpass)$"
reason = ".netrc/.pgpass blocked"

[[rules.secret.path]]
id = "cloud-sa"
regex = "(service-account|firebase-adminsdk|gcp-key)[^/]*\\.json$"
flags = "i"
reason = "Cloud service-account JSON blocked"

[[rules.secret.path]]
id = "tfstate"
regex = "\\.tfstate(\\.backup)?$|\\.terraform\\.tfstate\\.lock\\.info$"
reason = "Terraform state file blocked (often contains plaintext secrets)"

[[rules.secret.path]]
id = "npmrc"
regex = "(^|/)\\.npmrc$"
reason = ".npmrc blocked outside node_modules/ (may contain _authToken)"
except = "/node_modules/"

[[rules.secret.path]]
id = "gitconfig"
regex = "(^|/)\\.gitconfig$"
reason = ".gitconfig blocked (may contain [credential] tokens or signing keys)"

# Ticket 13: confirm rather than block — protects by default without
# stopping a legitimate read outright.
[[rules.secret.path]]
id = "transcript-backup"
regex = "(^|/)\\.claude/transcripts(/|$)"
reason = "transcript backup directory blocked (contains full session history)"
verdict = "confirm"

# The binary's own audit log (denial history is reconnaissance): confirm
# not block, same reasoning as transcript-backup — `bouncer audit` is the
# sanctioned read path and never reaches this guard. Known limit: matches
# the file path (and its `.log.1` rotation sibling), not a directory or
# glob read of `logs/hooks/`.
[[rules.secret.path]]
id = "bouncer-audit-log"
regex = "(^|/)logs/hooks/bouncer\\.log(\\.1)?$"
reason = "bouncer's own audit log — denial/confirm history is reconnaissance for a compromised agent"
verdict = "confirm"

# Ticket 19: the policy the binary itself RUNS ON — <configDir>/bouncer/
# policy.toml and <configDir>/bouncer/policy.d/ (src/adapter/policy.ts's
# overlayPath/overlayDirPath) — promoted from an account overlay
# (transitional, both profiles) into the baseline. This is the
# disarmament counterpart of bouncer-audit-log above: the log is
# reconnaissance, this rule is the disarm vector, and it passes the
# ticket-13 universality bar (every deployment has a policy to protect,
# and this layout is the product's own convention, not one workstation's).
# Baseline, not overlay, precisely because an invalid overlay file rejects
# the WHOLE overlay set and falls back to the baseline (policy/load.ts) —
# an overlay-hosted self-protection would be disarmed exactly in the
# murky scenarios it exists for.
#
# (a) The regex anchors on the literal `bouncer/` path segment, resolved
# through canonicalizePath()'s realpath (src/adapter/dispatch.ts) before
# this rule ever sees it — one pattern covers every symlinked mount
# (e.g. a `bouncer/policy.d` symlink to a shared dotfiles repo) without
# needing to enumerate targets. The flip side: an adapter whose overlay
# resolves somewhere with NO `bouncer/` segment in its real path escapes
# after realpath — carrying this protection along is that adapter's own
# responsibility, not a gap this rule can close from here. Review round
# 1: BOTH branches now require a trailing `/` or end-of-string after the
# live name — `(policy\.toml|policy\.d)(/|$)`, not `policy\.d(/|$)`
# alone — so `policy.toml.bak`, `policy.toml~`, `policy.tomlx` and any
# other near-miss stay unmatched, same precision as the `bouncer-audit-log`
# sibling above (`bouncer\.log(\.1)?$`) and the directory branch this rule
# always had. No coverage hole: any command that touches the LIVE file
# names it verbatim (a `cp`/`mv` to or from a `.bak` still carries the
# live token in one of its two path arguments).
#
# (b) The override loop: an `[[override]]` block that neutralizes this
# very rule is itself an edit to a policy.d file, so the live rule
# intercepts that edit too — ordinary, override-able protection, not a
# "sealed rule" (that stronger notion is a tracked backlog idea, not
# built here).
#
# (c) confirm, not block: editing one's own policy is a legitimate,
# common action that gets asked about, not stopped outright — same
# arbitration as bouncer-audit-log. secret.path has no read/write split,
# so this single rule covers reads AND writes alike (assumed, not a gap).
[[rules.secret.path]]
id = "bouncer-policy"
regex = "(^|/)bouncer/(policy\\.toml|policy\\.d)(/|$)"
reason = "bouncer's own policy — editing or reading it can disarm every other rule"
verdict = "confirm"

[[rules.secret.path]]
id = "secret-dir"
regex = "(^|/)(\\.?secrets|credentials)(/|$)"
reason = "Path inside secrets/ or credentials/ directory blocked"

[[rules.secret.path]]
id = "ssh-dir"
regex = "(^|/)\\.ssh(/|$)"
reason = ".ssh directory blocked"

[[rules.secret.path]]
id = "gnupg-dir"
regex = "(^|/)\\.gnupg(/|$)"
reason = ".gnupg directory blocked"

[[rules.secret.bash]]
id = "bash-git-leak-credential"
regex = "\\bgit\\s+config\\b[^\\n]*\\b(credential|user\\.signingkey)\\b"
reason = "git command may leak credentials (tokens in remote URLs, signing keys, credential helpers)"

[[rules.secret.bash]]
id = "bash-git-leak-remote-url"
regex = "\\bgit\\s+config\\b[^\\n]*\\bremote\\.[^\\s]+\\.url\\b"
reason = "git command may leak credentials (tokens in remote URLs, signing keys, credential helpers)"
special = "git_remote_url"

[[rules.secret.bash]]
id = "bash-url-creds"
regex = "\\b(?:https?|git|ssh|ftp):\\/\\/[^\\s/@:]+:[^\\s/@]+@"
reason = "URL contains embedded user:password credentials (likely token leak)"
