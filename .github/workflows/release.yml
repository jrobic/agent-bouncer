name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.x'
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run build
      - run: shasum -a 256 -c dist/bouncer.sha256
      - name: The artefact identifies the tagged version from a clean tree
        run: |
          ./dist/bouncer --version
          ./dist/bouncer --version | grep -q "^bouncer ${GITHUB_REF_NAME#v} ("
          ! ./dist/bouncer --version | grep -q -- '-dirty'
      - name: Package the versioned artefact and checksum
        run: |
          mkdir -p out
          NAME="bouncer-${GITHUB_REF_NAME#v}-${{ matrix.target }}.tar.gz"
          tar -czf "out/$NAME" -C dist bouncer
          tar -tvzf "out/$NAME"
          (cd out && shasum -a 256 "$NAME" > "$NAME.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Release notes are the CHANGELOG section of this version
        run: scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" > notes.md
      - name: Create the GitHub Release with both archives and their checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l out
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "bouncer $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Clone the tap and render the Homebrew formula
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { printf '%s\n' 'HOMEBREW_TAP_TOKEN is required' >&2; exit 1; }
          git clone "https://x-access-token:${TOKEN}@github.com/jrobic/homebrew-tap.git" tap
          mkdir -p tap/Formula
          scripts/brew-formula.sh \
            --name bouncer \
            --repo jrobic/agent-bouncer \
            --version "${GITHUB_REF_NAME#v}" \
            --desc "Guard coding-agent tool calls with declarative policy" \
            --homepage https://github.com/jrobic/agent-bouncer \
            --license MIT \
            --assets out \
            --caveats-file scripts/homebrew-caveats.txt \
            --target darwin-arm64 \
            --target linux-x64 > tap/Formula/bouncer.rb
          ruby -c tap/Formula/bouncer.rb
      - name: The rendered formula installs and passes its test on this runner
        env:
          HOMEBREW_DEVELOPER: '1'
        run: |
          brew tap-new --no-git jrobic/verify
          cp tap/Formula/bouncer.rb "$(brew --repository jrobic/verify)/Formula/bouncer.rb"
          brew install jrobic/verify/bouncer
          brew test jrobic/verify/bouncer
          "$(brew --prefix)/bin/bouncer" --version | grep -q "^bouncer ${GITHUB_REF_NAME#v} ("
      - name: Publish the formula to the tap
        run: |
          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C tap add Formula/bouncer.rb
          if git -C tap diff --cached --quiet; then
            echo "formula unchanged"
          else
            git -C tap commit -m "bouncer ${GITHUB_REF_NAME#v}"
            git -C tap pull --rebase
            git -C tap push
          fi
